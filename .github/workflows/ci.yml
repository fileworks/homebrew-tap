name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test bump and queue logic
        run: python -m unittest discover -s tests -v
      - name: Compile scripts
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python -m compileall -q .github/scripts tests
      - name: Check workflow input safety
        run: python .github/scripts/check_workflows.py

  formula-audit:
    name: formula-audit (${{ matrix.os }}, ${{ matrix.formula }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        formula: [immich-export, paperless-export]
    steps:
      - uses: actions/checkout@v7
      # The Ubuntu image ships Homebrew but does not put it on PATH, so `brew`
      # was simply not found and this job had never once run: it was added on a
      # branch that was never merged. Reported rather than silently dropped, so a
      # future image change that removes Homebrew fails loudly here.
      - name: Put Homebrew on PATH
        run: |
          if command -v brew >/dev/null; then
            echo "brew already on PATH: $(command -v brew)"
          elif [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            # PATH only: brew derives its prefix from its own location, and
            # `brew shellenv` emits `export KEY=value`, which GITHUB_ENV rejects.
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          else
            echo "::error::Homebrew is not available on this runner image"
            exit 1
          fi
      - name: Audit and style formula
        run: |
          brew tap --custom-remote fileworks/tap "$GITHUB_WORKSPACE"
          brew audit --strict "fileworks/tap/${{ matrix.formula }}"
          brew style "fileworks/tap/${{ matrix.formula }}"
      - name: Install and test formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_INDEX_URL: "http://127.0.0.1:9/package-index-access-is-forbidden"
          PIP_NO_INDEX: "1"
        run: |
          brew fetch --deps "fileworks/tap/${{ matrix.formula }}"
          brew fetch --build-from-source "fileworks/tap/${{ matrix.formula }}"
          brew install --build-from-source "fileworks/tap/${{ matrix.formula }}"
          brew test "fileworks/tap/${{ matrix.formula }}"

  docs-links:
    name: docs-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Generated by maintenance/workflows.py — regenerate, do not hand-edit.
      # Dependency-free on purpose: a link checker that needs a marketplace
      # action is a link checker that breaks when that action moves.
      - name: docs-links
        shell: python
        run: |
          import pathlib, re, sys

          link = re.compile(r"\[[^\]]*\]\(([^)\s]+)\)")
          skip = {
              ".git", ".venv", "node_modules", "dist", "build", "target",
              "site-packages", "_internal", "resources", "vendor",
          }
          problems = []

          for markdown in pathlib.Path(".").rglob("*.md"):
              if any(part in skip for part in markdown.parts):
                  continue
              for target in link.findall(markdown.read_text(encoding="utf-8", errors="replace")):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  if not (markdown.parent / target.split("#")[0]).exists():
                      problems.append(f"{markdown}: {target} does not exist")

          for problem in problems:
              print(problem)
          sys.exit(1 if problems else 0)
